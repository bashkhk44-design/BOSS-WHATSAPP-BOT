name: Neon STAGING Migration (Explicit Approval)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type APPLY-STAGING-MIGRATIONS to authorize migrations on the isolated Neon staging database only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-staging-migrations-explicit
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/ops/neon-staging-migration-runner' && inputs.confirm_target == 'APPLY-STAGING-MIGRATIONS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_DATABASE_URL }}
    steps:
      - name: Checkout reviewed staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/platform-webhook-runtime-lock-health

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact staging target and migration prerequisites (read only)
        shell: bash
        run: |
          node <<'NODE'
          const { Pool } = require('pg');

          const EXPECTED_HOST = 'ep-sweet-breeze-bepbeuoj.c-9.us-east-2.aws.neon.tech';
          const EXPECTED_DATABASE = 'neondb';
          const EXPECTED_ROLE = 'neondb_owner';

          async function main() {
            if (!process.env.DATABASE_URL) {
              throw new Error('Missing cloudflare-staging environment secret CLOUDFLARE_STAGING_DATABASE_URL.');
            }

            const url = new URL(process.env.DATABASE_URL);
            const database = decodeURIComponent(url.pathname.replace(/^\\//, ''));
            const role = decodeURIComponent(url.username);

            if (url.protocol !== 'postgresql:' && url.protocol !== 'postgres:') {
              throw new Error('Refusing connection: expected a PostgreSQL URL.');
            }
            if (url.hostname !== EXPECTED_HOST ||
                database !== EXPECTED_DATABASE ||
                role !== EXPECTED_ROLE ||
                !url.password ||
                url.port && url.port !== '5432' ||
                url.searchParams.get('sslmode') !== 'require') {
              throw new Error('Refusing connection: URL does not match the approved Neon STAGING host/database/role/TLS target.');
            }

            const pool = new Pool({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
              max: 1,
              connectionTimeoutMillis: 10000,
              query_timeout: 10000,
              statement_timeout: 10000
            });

            try {
              const client = await pool.connect();
              try {
                await client.query('BEGIN READ ONLY');
                const identity = await client.query(
                  "SELECT current_database() AS database, current_user AS role, current_setting('transaction_read_only') AS read_only"
                );
                const actual = identity.rows[0];
                if (actual.database !== EXPECTED_DATABASE ||
                    actual.role !== EXPECTED_ROLE ||
                    actual.read_only !== 'on') {
                  throw new Error('Connected database identity or read-only preflight state did not match.');
                }

                const prerequisite = await client.query(
                  "SELECT to_regclass('public.client_projects') IS NOT NULL AS client_projects_exists"
                );
                if (prerequisite.rows[0].client_projects_exists !== true) {
                  throw new Error('Required prerequisite public.client_projects is missing; refusing to migrate.');
                }

                const history = await client.query(
                  "SELECT to_regclass('public.schema_migrations') IS NOT NULL AS history_exists"
                );
                console.log('STAGING target verified: host, database, role and TLS match.');
                console.log('Database:', actual.database);
                console.log('Role:', actual.role);
                console.log('Prerequisite public.client_projects exists:', prerequisite.rows[0].client_projects_exists);
                console.log('Migration history table already exists:', history.rows[0].history_exists);
                await client.query('ROLLBACK');
              } finally {
                client.release();
              }
            } finally {
              await pool.end();
            }
          }

          main().catch(error => {
            console.error('STAGING READ-ONLY PREFLIGHT FAILED:', error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Verify reviewed migration allowlist
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { APPROVED_MIGRATION_FILES, listMigrationFiles } = require('./migrations/runner');

          const expected = [
            '001_foundation_database.sql',
            '002_distributed_bot_worker_indexes.sql',
            '003_bot_runtime_commands.sql',
            '004_manager_command_recovery.sql',
            '005_worker_health_heartbeats.sql',
            '006_auto_remediation_audit.sql',
            '007_platform_bot_inbox.sql',
            '20261118_bot_runtime_status.sql',
            '20261119_bot_inbound_update_lease_owner.sql',
            '20261119_bot_update_transport.sql',
            '20261121_project_notification_outbox.sql'
          ];
          const actual = listMigrationFiles(path.join(process.cwd(), 'migrations'));
          if (JSON.stringify(APPROVED_MIGRATION_FILES) !== JSON.stringify(expected) ||
              JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Migration runner allowlist differs from the reviewed staging migration set.');
          }
          for (const file of expected) {
            const sql = fs.readFileSync(path.join('migrations', file), 'utf8');
            if (!/^\\s*(?:--[^\\r\\n]*(?:\\r?\\n|$)\\s*)*BEGIN\\s*;/i.test(sql) ||
                !/\\bCOMMIT\\s*;\\s*$/i.test(sql)) {
              throw new Error('Migration transaction boundary check failed: ' + file);
            }
          }
          console.log('Reviewed migration allowlist verified:', expected.length, 'files.');
          NODE

      - name: Apply reviewed migrations to STAGING only
        run: npm run db:migrate

      - name: Verify outbox migration and required tables
        run: |
          node <<'NODE'
          const { Pool } = require('pg');

          async function main() {
            const pool = new Pool({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
              max: 1,
              connectionTimeoutMillis: 10000,
              query_timeout: 10000,
              statement_timeout: 10000
            });
            try {
              const identity = await pool.query(
                'SELECT current_database() AS database, current_user AS role'
              );
              if (identity.rows[0].database !== 'neondb' ||
                  identity.rows[0].role !== 'neondb_owner') {
                throw new Error('Post-migration database identity mismatch.');
              }
              const result = await pool.query(
                "SELECT version FROM public.schema_migrations WHERE version = $1",
                ['20261121_project_notification_outbox']
              );
              const tables = await pool.query(
                "SELECT to_regclass('public.project_notification_outbox') IS NOT NULL AS outbox_exists, to_regclass('public.project_intake_update_receipts') IS NOT NULL AS receipts_exists"
              );
              if (result.rowCount !== 1 ||
                  tables.rows[0].outbox_exists !== true ||
                  tables.rows[0].receipts_exists !== true) {
                throw new Error('Post-migration verification failed for the notification outbox schema.');
              }
              console.log('STAGING migration verified: outbox and intake receipt tables exist.');
            } finally {
              await pool.end();
            }
          }

          main().catch(error => {
            console.error('STAGING POST-MIGRATION VERIFICATION FAILED:', error.message);
            process.exitCode = 1;
          });
          NODE
