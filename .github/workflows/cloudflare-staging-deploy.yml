name: Deploy Cloudflare staging Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-staging-deploy.yml

permissions:
  contents: read

concurrency:
  group: boss-bot-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    steps:
      - name: Check out the approved staging source only
        uses: actions/checkout@v4
        with:
          ref: cloudflare-webhook-prep

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cloudflare staging tests
        run: npm test

      - name: Deploy staging Worker only
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staging Worker configuration
        run: |
          set -euo pipefail
          WORKER_URL="https://boss-bot-master-staging.bashkhk44.workers.dev"
          HEALTH="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$WORKER_URL/healthz")"
          echo "$HEALTH"
          node -e 'const h=JSON.parse(process.argv[1]); if (!h.ok || !h.hyperdriveConfigured || !h.masterConfigured) process.exit(1)' "$HEALTH"

      - name: Verify staging Neon database
        run: |
          set -euo pipefail
          WORKER_URL="https://boss-bot-master-staging.bashkhk44.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$WORKER_URL/db-healthz"
          echo
