name: Neon Staging Migrations (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "اكتب STAGING-ONLY لتأكيد قاعدة Neon التجريبية"
        required: true
        type: string
      confirm_execution:
        description: "اكتب RUN-STAGING-MIGRATIONS للسماح بتنفيذ الترحيلات فعلياً"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-staging-migrations-only
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      ${{ github.ref == 'refs/heads/staging/unified-platform-tls-migrations' &&
          inputs.confirm_target == 'STAGING-ONLY' &&
          inputs.confirm_execution == 'RUN-STAGING-MIGRATIONS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_DATABASE_URL }}
      DATABASE_SSL: require
      DATABASE_SSL_REJECT_UNAUTHORIZED: 'true'

    steps:
      - name: Checkout reviewed staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/unified-platform-tls-migrations

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Verify exact Neon staging target, TLS, schema prerequisites, and migration allowlist
        run: |
          node <<'NODE'
          const path = require('node:path');
          const { Pool } = require('pg');
          const { APPROVED_MIGRATION_FILES, listMigrationFiles } = require('./migrations/runner');

          const expectedHost = 'ep-sweet-breeze-bepbeuoj.c-9.us-east-2.aws.neon.tech';
          const expectedDatabase = 'neondb';
          const expectedRole = 'neondb_owner';
          const expectedMigrations = [
            '001_foundation_database.sql',
            '002_distributed_bot_worker_indexes.sql',
            '003_bot_runtime_commands.sql',
            '004_manager_command_recovery.sql',
            '005_worker_health_heartbeats.sql',
            '006_auto_remediation_audit.sql',
            '007_platform_bot_inbox.sql',
            '20261118_bot_runtime_status.sql',
            '20261119_bot_inbound_update_lease_owner.sql',
            '20261119_bot_update_transport.sql',
            '20261121_project_notification_outbox.sql'
          ];
          const requiredTables = [
            'telegram_bots',
            'clients',
            'client_projects',
            'client_conversations',
            'project_specs',
            'project_events',
            'client_intake_sessions',
            'project_secrets',
            'project_ai_jobs',
            'project_ai_job_attempts',
            'project_build_approvals',
            'project_release_candidates',
            'project_release_approvals',
            'project_deployment_authorizations'
          ];

          async function main() {
            if (!process.env.DATABASE_URL) {
              throw new Error('Missing CLOUDFLARE_STAGING_DATABASE_URL in cloudflare-staging environment.');
            }

            const parsed = new URL(process.env.DATABASE_URL);
            if (parsed.hostname !== expectedHost ||
                parsed.pathname !== '/' + expectedDatabase ||
                decodeURIComponent(parsed.username) !== expectedRole) {
              throw new Error('Refusing to connect: database URL does not match the approved Neon STAGING host, database, and role.');
            }

            const migrationsDir = path.join(process.cwd(), 'migrations');
            const runnerFiles = listMigrationFiles(migrationsDir);
            if (JSON.stringify(APPROVED_MIGRATION_FILES) !== JSON.stringify(expectedMigrations) ||
                JSON.stringify(runnerFiles) !== JSON.stringify(expectedMigrations)) {
              throw new Error('Migration runner differs from the reviewed 11-file allowlist. No migrations were executed.');
            }

            const sslMode = parsed.searchParams.get('sslmode');
            if (!['require', 'verify-full'].includes(sslMode)) {
              throw new Error('Refusing connection: Neon URL must declare sslmode=require or sslmode=verify-full.');
            }
            parsed.searchParams.delete('sslmode');

            const pool = new Pool({
              connectionString: parsed.toString(),
              ssl: { rejectUnauthorized: true, servername: expectedHost },
              max: 1,
              connectionTimeoutMillis: 10000
            });

            try {
              const identity = await pool.query(
                'SELECT current_database() AS db, current_user AS role'
              );
              const row = identity.rows[0];
              if (row.db !== expectedDatabase || row.role !== expectedRole) {
                throw new Error('Connected database identity differs from the approved staging target.');
              }

              const schema = await pool.query(
                `SELECT table_name,
                        to_regclass('public.' || table_name) IS NOT NULL AS present
                 FROM unnest($1::text[]) AS required(table_name)`,
                [requiredTables]
              );
              const missing = schema.rows.filter(item => !item.present).map(item => item.table_name);
              if (missing.length) {
                throw new Error(
                  'Required bootstrap tables are missing: ' + missing.join(', ') +
                  '. Stop here; run the separately reviewed staging bootstrap before migrations.'
                );
              }

              console.log('Read-only preflight passed: approved Neon staging identity, verified TLS, prerequisite schema, and 11-file allowlist.');
            } finally {
              await pool.end();
            }
          }

          main().catch(error => {
            console.error('STAGING PREFLIGHT FAILED:', error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Apply reviewed migrations to Neon STAGING
        run: npm run db:migrate
