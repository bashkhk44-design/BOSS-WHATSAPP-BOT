name: Cloudflare staging bundle validation

on:
  push:
    branches:
      - ops/cloudflare-staging-isolation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.bundle-test.jsonc --outdir /tmp/boss-platform-worker-bundle
