name: Deploy isolated staging Worker

on:
  push:
    branches:
      - cloudflare-db-schema-staging
    paths:
      - "cloudflare/worker.mjs"
      - "wrangler.staging.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-bot-master-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy boss-bot-master-staging only
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cloudflare-db-schema-staging'
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-db-schema-staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          npx --yes wrangler@4.165.0 deploy --config wrangler.staging.jsonc
