name: AI Suite Quality

on:
  push:
    branches:
      - feature/ai-suite-hardening
  pull_request:
    branches:
      - audit-hardening

permissions:
  contents: read

jobs:
  ai-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run AI quality tests
        run: npm test
